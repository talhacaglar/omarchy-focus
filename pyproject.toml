[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omarchy-focus"
version = "0.2.0"
description = "Pomodoro timer, task queue and site blocker for Omarchy: TUI, CLI and a native bar widget."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Talha Caglar" }
]
keywords = ["omarchy", "hyprland", "pomodoro", "focus", "tui", "textual", "arch-linux"]
classifiers = [
  "Environment :: Console :: Curses",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]

dependencies = [
  "textual>=0.58.1"
]

[project.urls]
Homepage = "https://github.com/talhacaglar/omarchy-focus"
Issues = "https://github.com/talhacaglar/omarchy-focus/issues"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
]

[project.scripts]
omarchy-focus = "omarchy_focus.cli:main"
omarchy-focus-hosts-helper = "omarchy_focus.focus_hosts_helper:main"
# Names from earlier releases, kept so existing keybindings keep working.
clar-focus = "omarchy_focus.cli:main"
clar-focus-hosts-helper = "omarchy_focus.focus_hosts_helper:main"
focus = "omarchy_focus.legacy:main"
focus-indicator = "omarchy_focus.legacy:indicator_main"

[tool.hatch.build.targets.wheel]
packages = ["src/omarchy_focus"]

[tool.hatch.build.targets.sdist]
include = [
  "src/omarchy_focus",
  "README.md",
  "install.sh",
  "examples",
  "tests",
  "scripts",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["omarchy_focus"]

[tool.mypy]
python_version = "3.12"
packages = ["omarchy_focus"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
